name: "Build iOS IPA"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: "Build Generals Zero Hour iOS IPA"
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: "Checkout Repository with Submodules"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Install Build Tools & Autotools"
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          echo "==> Installing build tools via Homebrew"
          brew install autoconf automake libtool pkg-config nasm xcodegen glslang sdl3 meson || true

      - name: "Setup vcpkg (Full Clone for Baseline Support)"
        run: |
          echo "==> Cloning vcpkg (full clone required for manifest baseline)"
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          echo "$HOME/vcpkg" >> $GITHUB_PATH

      - name: "Install Vulkan SDK and MoltenVK"
        run: |
          echo "==> Downloading and installing LunarG Vulkan SDK"
          VULKAN_ZIP="/tmp/vulkansdk-macos-1.4.341.1.zip"
          curl -fL -o "$VULKAN_ZIP" "https://sdk.lunarg.com/sdk/download/1.4.341.1/mac/vulkansdk-macos-1.4.341.1.zip"
          unzip -q -o "$VULKAN_ZIP" -d /tmp/vulkan-extract
          VULKAN_APP=$(find /tmp/vulkan-extract -name "*.app" -type d | head -1)
          INSTALLER="$VULKAN_APP/Contents/MacOS/vulkansdk-macOS-1.4.341.1"
          chmod +x "$INSTALLER"
          "$INSTALLER" --root "$HOME/VulkanSDK/1.4.341.1" --accept-licenses --default-answer --confirm-command install
          echo "VULKAN_SDK=$HOME/VulkanSDK/1.4.341.1/macOS" >> $GITHUB_ENV
          echo "$HOME/VulkanSDK/1.4.341.1/macOS/bin" >> $GITHUB_PATH

          echo "==> Staging iOS MoltenVK and Liberation Fonts"
          chmod +x scripts/build/ios/*.sh
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: "Configure CMake for iOS"
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
          CC: clang
          CXX: clang++
        run: |
          git submodule update --init references/fbraz3-dxvk || true
          cmake --preset ios-vulkan

      - name: "Compile Zero Hour Engine"
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
        run: |
          echo "Building with controlled parallel jobs to protect memory..."
          cmake --build build/ios-vulkan --target z_generals -j 2 2>&1 | tee build.log || (tail -n 50 build.log && exit 1)

      - name: "Package App into IPA"
        run: |
          echo "==> Generating Xcode shell project"
          (cd ios && xcodegen generate)

          echo "==> Building unsigned shell app"
          xcodebuild -project ios/GeneralsXZH.xcodeproj \
            -scheme GeneralsXZH -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -10

          SHELL_APP=$(find ios/build -name "GeneralsXZH.app" -type d | head -1)
          echo "Shell app located at: $SHELL_APP"

          ENGINE_BIN=$(find build/ios-vulkan -name "GeneralsXZH" -type f | head -1)
          echo "Compiled Engine binary located at: $ENGINE_BIN"

          echo "==> Assembling application bundle"
          rm -rf app-staging Payload
          mkdir -p app-staging Payload
          cp -R "$SHELL_APP" app-staging/GeneralsXZH.app
          APP="app-staging/GeneralsXZH.app"

          # Replace stub binary with compiled game engine
          cp "$ENGINE_BIN" "$APP/GeneralsXZH"
          chmod +x "$APP/GeneralsXZH"

          # Embed dynamic runtime libraries (DXVK, MoltenVK, SDL3, OpenAL)
          mkdir -p "$APP/Frameworks"
          find build/ios-vulkan -name "*.dylib" -exec cp {} "$APP/Frameworks/" \; 2>/dev/null || true
          MVK=$(find "$HOME" "/tmp" -name "MoltenVK.framework" -type d | head -1)
          if [ -n "$MVK" ]; then
            echo "Embedding MoltenVK framework from: $MVK"
            cp -R "$MVK" "$APP/Frameworks/"
          fi

          # Stage configs and fonts
          mkdir -p "$APP/GameData/fonts"
          cp ios/config/* "$APP/GameData/" 2>/dev/null || true
          find "$HOME" -name "*.ttf" -exec cp {} "$APP/GameData/fonts/" \; 2>/dev/null || true

          # Ad-hoc sign for sideloading
          codesign --force --deep --sign - "$APP" || true

          # Package into IPA
          cp -R "$APP" Payload/
          zip -qr9 GeneralsZeroHour.ipa Payload
          echo "==> Final IPA size:"
          ls -lh GeneralsZeroHour.ipa

      - name: "Upload IPA to GitHub Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "Generals-Zero-Hour-iOS-IPA"
          path: "GeneralsZeroHour.ipa"
          retention-days: 14
